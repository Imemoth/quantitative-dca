# Frozen V1 feature-definition contract. This is a controlled design schema,
# not empirical feature selection and not evidence of provider capability.
schema_version: 1
registry_version: features-v1
panel_budget:
  final_min: 80
  final_max: 95
  registered_feature_count: 81
  reserved_interpretable_regime_slots: 5
  reserved_unsupervised_regime_slots: 8
dependencies:
  price_history:
    name: "ohlcv.daily_bars"
    availability_field: available_at
    join_rule: "available_at <= prediction_timestamp"
    revision_policy: as_of_vintage
    value_basis: verified_corporate_action_adjusted_feature_price
    required_provenance: [price_basis, corporate_action_lineage]
  corporate_actions:
    name: "corporate_actions.events"
    availability_field: available_at
    join_rule: "available_at <= prediction_timestamp"
    revision_policy: as_of_vintage
    value_basis: announced_action_vintage
    required_provenance: [action_id, action_type, effective_date]
  unadjusted_close:
    name: "ohlcv.unadjusted_close"
    availability_field: available_at
    join_rule: "available_at <= prediction_timestamp"
    revision_policy: as_of_vintage
    value_basis: canonical_unadjusted_close
    required_provenance: [price_basis=unadjusted]
  original_unit_volume:
    name: "ohlcv.original_unit_volume"
    availability_field: available_at
    join_rule: "available_at <= prediction_timestamp"
    revision_policy: as_of_vintage
    value_basis: verified_original_share_units
    required_provenance: [volume_basis=original_share_units]
  historical_currency:
    name: "security.historical_currency"
    availability_field: available_at
    join_rule: "available_at <= prediction_timestamp"
    revision_policy: as_of_vintage
    value_basis: listing_currency_at_historical_eod
    required_provenance: [currency, active_from, active_to]
  fx_quotes:
    name: "fx.quotes"
    availability_field: available_at
    join_rule: "fixing_at <= historical_eod and available_at <= historical_eod"
    revision_policy: as_of_vintage
    value_basis: quote_currency_units_per_base_currency
    required_provenance: [base_currency, quote_currency, fixing_at, quote_type=spot]
  membership:
    name: "universe.historical_membership"
    availability_field: available_at
    join_rule: "available_at <= prediction_timestamp"
    revision_policy: as_of_vintage
    value_basis: historical_active_interval
    required_provenance: [active_from, active_to, exchange, region]
  classification:
    name: "classification.point_in_time"
    availability_field: available_at
    join_rule: "available_at <= prediction_timestamp"
    revision_policy: as_of_vintage
    value_basis: point_in_time_classification
    required_provenance: [effective_date, classification_version]
  fundamentals:
    name: "fundamentals.reported_vintages"
    availability_field: available_at
    join_rule: "available_at <= prediction_timestamp"
    revision_policy: as_of_vintage
    value_basis: latest_reported_vintage_known_at_prediction
    required_provenance: [period_end, published_at, revision_id]
  macro:
    name: "macro.realtime_vintages"
    availability_field: available_at
    join_rule: "available_at <= prediction_timestamp"
    revision_policy: as_of_vintage
    value_basis: realtime_macro_vintage
    required_provenance: [observation_date, published_at, revision_id]
  market:
    name: "market_context.daily_bars"
    availability_field: available_at
    join_rule: "available_at <= prediction_timestamp"
    revision_policy: as_of_vintage
    value_basis: verified_market_context_series
    required_provenance: [market_session, source, revision_id]
  event_calendar:
    name: "events.announced_calendar"
    availability_field: available_at
    join_rule: "available_at <= prediction_timestamp"
    revision_policy: as_of_vintage
    value_basis: event_date_announced_by_prediction
    required_provenance: [announced_at, event_date, revision_id]
features:
  - name: return_5d_raw
    domain: price_trend
    base_signal: return_5d
    raw_dependencies: [price_history, corporate_actions]
    lookback_sessions: 6
    availability_rule: next_eod_after_all_inputs_available
    quality_floor: C
    transform: raw
    formula: "adjusted_close_t / adjusted_close_t_minus_5 - 1"
    normalization: none
    applicability: all_eligible_equities
    missing_policy: preserve_missing
  - name: return_20d_raw
    domain: price_trend
