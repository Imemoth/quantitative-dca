[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-dca"
version = "0.1.0"
description = "Point-in-time data foundation for Quant DCA research"
requires-python = ">=3.12"
dependencies = [
    "exchange-calendars==4.13.2",
    "pandas>=2.2,<3",
    "pyarrow>=25,<26",
    "PyYAML>=6,<7",
    "numpy==2.2.6",
    "scipy==1.15.3",
    "scikit-learn==1.7.2",
    "hmmlearn==0.3.3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
